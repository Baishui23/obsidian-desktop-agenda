<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>桌面日程 · 今日与遗留任务</title>
  <link rel="stylesheet" href="window.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark">◒</span><span>今日计划</span><span class="preview">本地</span></div>
      <div class="window-actions">
        <button id="fit" class="icon-button" title="适配当前屏幕并贴靠右侧" aria-label="适配屏幕"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M15 7v7"/></svg></button>
        <button id="desktop" class="icon-button" title="切换置底显示与前置编辑" aria-label="切换置底显示与前置编辑" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M8 9v10"/></svg></button>
        <button id="close" class="icon-button close-button" title="关闭窗口" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <main>
      <section class="clock-section">
        <div><p id="date" class="date">10 月 26 日 · 星期一</p><div id="clock" class="clock">--:--<span>今天</span></div></div>
        <div class="pace"><span class="live-dot"></span>把今天安排好</div>
      </section>

      <section class="focus-card">
        <div class="eyebrow"><span class="focus-dot"></span>今天最重要的一件事<span class="number">01</span></div>
        <h1 id="focus-title">正在读取任务…</h1>
        <p id="focus-description">优先显示标记 #首要 的未完成任务。</p>
        <div class="focus-bottom"><span id="focus-tag" class="focus-tag">今日安排</span><span id="task-total">来自你的笔记</span></div>
      </section>

      <section class="agenda-section">
        <div class="section-heading"><h2 id="list-heading">今日与遗留</h2><span id="progress">正在读取</span></div>
        <div class="task-toolbar"><button id="view-today" class="text-button active" aria-pressed="true">今日与遗留</button><button id="view-all" class="text-button" aria-pressed="false">全部未完成</button><button id="refresh" class="text-button refresh-button" title="重新读取任务">刷新</button></div>
        <p id="task-status" class="task-status" role="status" aria-live="polite">正在读取带 #task 的 Markdown 任务。</p>
        <div id="task-list" class="task-list"></div>
        <p id="empty-state" class="demo-note" hidden>没有符合条件的任务。按模板填写任务后会自动显示。</p>
        <details id="task-issues" class="task-issues" hidden><summary id="issues-title"></summary><ul id="issues-list"></ul></details>
        <p class="demo-note">勾选和延期会更新原笔记；延期默认保留截止日。</p>
      </section>
    </main>

    <footer>
      <div class="opacity-control"><label for="opacity">窗口不透明度</label><input id="opacity" type="range" min="0" max="100" value="93" aria-valuetext="93%"><output id="opacity-value" for="opacity">93%</output></div>
      <div class="footer-line"><span><span id="mode-dot" class="status-dot"></span><span id="mode-label">窗口编辑</span></span><span id="layout-hint">拖动顶部移动 · 边缘缩放</span></div>
    </footer>
  </div>
</body>
</html>
